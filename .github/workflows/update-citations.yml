name: Update citations

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch citation counts and write them into index.html
        run: python scripts/update_citations.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/citations.json index.html; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/citations.json index.html
          git commit -m "Update citation counts"
          git push
